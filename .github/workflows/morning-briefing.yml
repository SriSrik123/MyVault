name: Morning Briefing

# Starts at 6:00 AM ET (11:00 UTC) and polls WHOOP until recovery is ready
# (up to 9:00 AM ET — 3-hour window). Also manually triggerable.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # up to 4 hours total (3h WHOOP poll + 1h Claude)

    permissions:
      contents: write

    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "morning-briefing[bot]"
          git config user.email "morning-briefing[bot]@users.noreply.github.com"

      - name: Install Python deps
        run: pip install certifi --quiet

      - name: Wait for WHOOP recovery data
        id: whoop
        timeout-minutes: 180
        env:
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_DATA_FILE: /tmp/whoop_today.json
        run: python3 scripts/fetch_whoop.py

      - name: Rotate WHOOP refresh token
        # Updates the stored secret so the next run has a valid token.
        # Requires GH_PAT secret: a fine-grained PAT with
        # Repository → Secrets → Read and write permission for MyVault.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "${{ steps.whoop.outputs.new_refresh_token }}" \
            | gh secret set WHOOP_REFRESH_TOKEN --repo ${{ github.repository }}

      - name: Generate morning briefing
        uses: anthropic/claude-code-action@v1
        env:
          WHOOP_DATA_FILE: /tmp/whoop_today.json
        with:
          prompt: |
            Run the morning-briefing skill (/morning-briefing).
            Running in GitHub Actions — WHOOP data has been pre-fetched and is
            available at the path in the WHOOP_DATA_FILE environment variable.
            The Google Calendar MCP may or may not be available — use it if it
            is, otherwise use the fallback message for the schedule section.
            Push the briefing to main when done.
          allowed_tools: >-
            Bash(date:*),
            Bash(ls *),
            Bash(cat *),
            Bash(mkdir -p *),
            Bash(python3 -c *quotes*),
            Bash(git *),
            Read,
            Write
          max_turns: "30"
