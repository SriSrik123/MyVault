<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Ironman 70.3 Jones Beach — End Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #E8001D;
    --red-dark: #9B0012;
    --red-glow: rgba(232, 0, 29, 0.25);
    --white: #FFFFFF;
    --off-white: #D4C8B8;
    --gray: #7A7068;
    --black: #060607;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--black);
    font-family: 'Barlow Condensed', sans-serif;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.045;
    pointer-events: none;
    z-index: 1000;
    mix-blend-mode: overlay;
  }

  /* Background dramatic lighting */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 50% 55%, rgba(180,0,18,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 600px 400px at 50% 55%, rgba(232,0,29,0.08) 0%, transparent 60%),
      linear-gradient(180deg, #0A0A0B 0%, #060607 40%, #0D0305 100%);
  }

  /* Scanline effect — subtle */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  /* Main layout container */
  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* TOP AREA */
  .top-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 72px 80px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeDown 1s ease 0.2s both;
  }

  .day-in-life-label {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 0.35em;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .thin-line {
    width: 2px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--red), transparent);
    margin: 0 auto;
  }

  /* MAIN NUMBER */
  .number-block {
    text-align: center;
    position: relative;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
  }

  .weeks-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 480px;
    line-height: 0.88;
    color: var(--white);
    letter-spacing: -0.02em;
    position: relative;
    display: block;
    /* Text shadow for depth */
    text-shadow:
      0 0 120px rgba(232,0,29,0.3),
      0 0 60px rgba(232,0,29,0.15),
      0 8px 40px rgba(0,0,0,0.8);
  }

  /* Subtle red underline on the 16 */
  .weeks-number::after {
    content: '';
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 4px;
    background: linear-gradient(to right, transparent, var(--red) 20%, var(--red) 80%, transparent);
    opacity: 0.7;
  }

  .weeks-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: 0.22em;
    color: var(--red);
    text-transform: uppercase;
    margin-top: -10px;
    display: block;
  }

  .out-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 300;
    font-size: 72px;
    letter-spacing: 0.45em;
    color: var(--off-white);
    text-transform: uppercase;
    margin-top: -4px;
    display: block;
    opacity: 0.75;
  }

  /* DIVIDER WITH ICONS */
  .divider-section {
    display: flex;
    align-items: center;
    gap: 40px;
    margin: 56px 0 52px;
    animation: fadeIn 0.8s ease 0.7s both;
  }

  .divider-line {
    width: 200px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gray));
  }
  .divider-line.right {
    background: linear-gradient(to left, transparent, var(--gray));
  }

  .icons-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.8s; }
  .dot:nth-child(3) { animation-delay: 1.6s; }

  /* RACE INFO */
  .race-block {
    text-align: center;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
  }

  .race-series {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 56px;
    letter-spacing: 0.18em;
    color: var(--off-white);
    text-transform: uppercase;
    display: block;
    opacity: 0.5;
    margin-bottom: 12px;
  }

  .race-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 148px;
    line-height: 0.92;
    letter-spacing: 0.04em;
    color: var(--white);
    text-transform: uppercase;
    display: block;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6);
  }

  .race-location {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 148px;
    line-height: 0.92;
    letter-spacing: 0.04em;
    display: block;
    /* Red outline text effect */
    -webkit-text-stroke: 2.5px var(--red);
    color: transparent;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* DATE + BOTTOM */
  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 80px 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    animation: fadeUp 0.8s ease 0.85s both;
  }

  .date-chip {
    background: rgba(232,0,29,0.12);
    border: 1px solid rgba(232,0,29,0.35);
    border-radius: 3px;
    padding: 14px 48px;
    display: inline-block;
  }

  .date-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 36px;
    letter-spacing: 0.28em;
    color: var(--red);
    text-transform: uppercase;
  }

  .triathlon-types {
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .discipline {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 24px;
    letter-spacing: 0.25em;
    color: var(--gray);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .discipline-dot {
    width: 5px;
    height: 5px;
    background: var(--gray);
    border-radius: 50%;
  }

  .bottom-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.06) 50%, transparent);
  }

  .hashtag-row {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: rgba(122, 112, 104, 0.5);
    text-align: center;
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 60px;
    height: 60px;
    z-index: 20;
  }
  .corner-tl { top: 40px; left: 40px; border-top: 2px solid rgba(232,0,29,0.4); border-left: 2px solid rgba(232,0,29,0.4); }
  .corner-tr { top: 40px; right: 40px; border-top: 2px solid rgba(232,0,29,0.4); border-right: 2px solid rgba(232,0,29,0.4); }
  .corner-bl { bottom: 40px; left: 40px; border-bottom: 2px solid rgba(232,0,29,0.4); border-left: 2px solid rgba(232,0,29,0.4); }
  .corner-br { bottom: 40px; right: 40px; border-bottom: 2px solid rgba(232,0,29,0.4); border-right: 2px solid rgba(232,0,29,0.4); }

  /* Shimmer line across top of number */
  .shimmer-line {
    position: absolute;
    top: 0;
    left: -10%;
    width: 120%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0; transform: translateX(-20px); }
    50% { opacity: 1; transform: translateX(20px); }
  }

  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 120px rgba(232,0,29,0.3), 0 0 60px rgba(232,0,29,0.15), 0 8px 40px rgba(0,0,0,0.8); }
    50% { text-shadow: 0 0 160px rgba(232,0,29,0.45), 0 0 80px rgba(232,0,29,0.25), 0 8px 40px rgba(0,0,0,0.8); }
  }

  .weeks-number { animation: breathe 4s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scanlines"></div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="card">

    <!-- TOP: Day in the life label -->
    <div class="top-area">
      <span class="day-in-life-label">Day in the Life</span>
      <div class="thin-line"></div>
    </div>

    <!-- MAIN: Big number -->
    <div class="number-block" style="margin-top: -80px;">
      <div class="shimmer-line"></div>
      <span class="weeks-number">16</span>
      <span class="weeks-label">Weeks</span>
      <span class="out-label">Out</span>
    </div>

    <!-- DIVIDER -->
    <div class="divider-section">
      <div class="divider-line"></div>
      <div class="icons-row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="divider-line right"></div>
    </div>

    <!-- RACE INFO -->
    <div class="race-block">
      <span class="race-series">Ironman 70.3</span>
      <span class="race-name">Jones</span>
      <span class="race-location">Beach</span>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-area">
      <div class="bottom-rule"></div>
      <div class="date-chip">
        <span class="date-text">Sept 26, 2026</span>
      </div>
      <div class="triathlon-types">
        <span class="discipline">1.2mi Swim</span>
        <div class="discipline-dot"></div>
        <span class="discipline">56mi Bike</span>
        <div class="discipline-dot"></div>
        <span class="discipline">13.1mi Run</span>
      </div>
      <div class="hashtag-row">#ironman703 &nbsp;·&nbsp; #jonesbeach &nbsp;·&nbsp; #triathlon</div>
    </div>

  </div>
</body>
</html>
